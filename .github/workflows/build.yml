name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle (no wrapper needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        shell: bash
        run: |
          gradle assembleRelease -Pvc=${{ github.run_number }} --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Put errors in the run summary
        if: failure()
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E "^e: |What went wrong|Execution failed|Could not resolve|Duplicate class|D8:|error:" -A6 build.log | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk YTGrab-build-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          body: Automatic release build from commit ${{ github.sha }}
          files: YTGrab-build-${{ github.run_number }}.apk

      - name: Notify success
        if: success()
        run: |
          curl -s \
            -H "Title: YTGrab build ${{ github.run_number }} succeeded" \
            -H "Tags: white_check_mark" \
            -H "Click: https://github.com/${{ github.repository }}/releases/latest" \
            -d "The release is ready to install." \
            https://ntfy.sh/ytgrab-b52b7c7c0142

      - name: Notify failure
        if: failure()
        run: |
          ERR=$(grep -E "^e: |What went wrong|Could not resolve|Execution failed|keystore" -A3 build.log 2>/dev/null | head -8 | cut -c1-200)
          curl -s \
            -H "Title: YTGrab build ${{ github.run_number }} FAILED" \
            -H "Priority: high" \
            -H "Tags: x" \
            -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "${ERR:-Open the run to see what went wrong.}" \
            https://ntfy.sh/ytgrab-b52b7c7c0142
